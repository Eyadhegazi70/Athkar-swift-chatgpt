name: AthkarApp
options:
  bundleIdPrefix: com.eyad
targets:
  AthkarApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        excludes:
          - Package.swift
          - project.yml
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eyad.athkarapp
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      SWIFT_VERSION: "5.0"
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: "1"
      MARKETING_VERSION: "1.0"
      PRODUCT_NAME: Athkar
      INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "يحتاج التطبيق تحديد موقعك الحالي لحساب اتجاه القبلة بدقة."
      INFOPLIST_KEY_UILaunchScreen: ""
