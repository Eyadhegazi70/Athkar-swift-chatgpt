name: AthkarApp
options:
  bundleIdPrefix: com.eyad
targets:
  AthkarApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        excludes:
          - Package.swift
          - project.yml
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eyad.athkarapp
      INFOPLIST_FILE: Info.plist
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      SWIFT_VERSION: "5.0"
