name: AthkarApp
options:
  bundleIdPrefix: com.eyad
targets:
  AthkarApp:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: .
        excludes:
          - Package.swift
          - project.yml
          - Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eyad.athkarapp
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGNING_ALLOWED: NO
      SWIFT_VERSION: "5.0"
    info:
      properties:
        CFBundleIdentifier: com.eyad.athkarapp
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: Athkar
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "يحتاج التطبيق تحديد موقعك الحالي لحساب اتجاه القبلة بدقة."
