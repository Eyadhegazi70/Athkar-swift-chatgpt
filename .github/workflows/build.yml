name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build with Swift PM for iOS
      run: |
        # تحديد مسار الـ SDK الخاص بالآيفون لكي يتعرف النظام على مكتبة UIKit
        SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
        
        # بناء المشروع وتوجيهه للعمل على منصة iOS
        swift build -c release \
          --triple arm64-apple-ios15.0-simulator \
          -Xswiftc -sdk -Xswiftc "$SDK_PATH"
        
        # تجهيز مجلد الـ IPA الناتج
        mkdir -p Payload/AthkarApp.app
        
        # نسخ الملف التنفيذي الناتج
        cp .build/arm64-apple-ios15.0-simulator/release/AthkarApp Payload/AthkarApp.app/AthkarApp
        
        # نسخ ملف Info.plist
        if [ -f "Info.plist" ]; then
          cp Info.plist Payload/AthkarApp.app/
        fi
        
        # ضغط المجلد لإنشاء ملف الـ IPA النهائي
        zip -r AthkarApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthkarApp-IPA
        path: AthkarApp.ipa
