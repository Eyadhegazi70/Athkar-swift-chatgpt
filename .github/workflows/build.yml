name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Install XcodeGen and Generate Project
      run: |
        brew install xcodegen
        xcodegen generate

    - name: Build App & Create IPA
      run: |
        # البناء للآيفون الحقيقي مع تفعيل التوقيع المؤقت (Ad-Hoc) لنجاح البناء
        xcodebuild -project AthkarApp.xcodeproj \
                   -scheme AthkarApp \
                   -sdk iphoneos \
                   -configuration Release \
                   -derivedDataPath build/DerivedData \
                   CODE_SIGN_STYLE=Manual \
                   CODE_SIGN_IDENTITY="-" \
                   CODE_SIGNING_REQUIRED=YES \
                   CODE_SIGNING_ALLOWED=YES \
                   build

        # استخراج وتغليف حزمة الـ IPA
        mkdir -p Payload
        cp -R build/DerivedData/Build/Products/Release-iphoneos/AthkarApp.app Payload/ || cp -R build/DerivedData/Build/Products/Release-iphoneos/Athkar.app Payload/
        zip -r AthkarApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthkarApp-IPA
        path: AthkarApp.ipa
