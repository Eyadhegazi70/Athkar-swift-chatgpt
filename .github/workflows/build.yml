name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build App & Create IPA
      run: |
        # بناء تطبيق الـ Swift Package باستخدام xcodebuild الرسمي
        xcodebuild -scheme AthkarApp \
                   -destination 'generic/platform=iOS' \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   BUILD_DIR=build

        # تجميع ملف الـ IPA
        mkdir -p Payload
        cp -R build/Release-iphoneos/AthkarApp.app Payload/ || cp -R build/Release-iphoneos/AthkarApp Payload/AthkarApp.app
        zip -r AthkarApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthkarApp-IPA
        path: AthkarApp.ipa
