name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build Swift Package for iOS
     
      run: |
        # الحصول على مسار SDK الخاص بمحاكي الآيفون
        SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
        
        # بناء الحزمة مع ربط مسارات الهواتف ومكتبات UIKit
        swift build -c release \
          --triple arm64-apple-ios15.0-simulator \
          -Xswiftc -sdk -Xswiftc "$SDK_PATH" \
          -Xswiftc -I$SDK_PATH/usr/include \
          -Xlinker -sdk_version -Xlinker 15.0
        
        # تجهيز مجلد الـ IPA
        mkdir -p Payload/AthkarApp.app
        
        # نسخ الملف التنفيذي
        cp .build/arm64-apple-ios15.0-simulator/release/AthkarApp Payload/AthkarApp.app/AthkarApp
        
        # نسخ ملف الـ Info.plist
        if [ -f "Info.plist" ]; then
          cp Info.plist Payload/AthkarApp.app/Info.plist
        fi
        
        # ضغط الملف لإنشاء الـ .ipa
        zip -r AthkarApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthkarApp-IPA
        path: AthkarApp.ipa
