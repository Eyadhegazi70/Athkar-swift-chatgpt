name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: Build iOS App via Xcodebuild
      run: |
        # بناء الحزمة لتستهدف آيفون وتتعرف على مكتبة UIKit
        xcodebuild -scheme AthkarApp \
                   -destination 'platform=iOS Simulator,name=iPhone 16' \
                   -configuration Release \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   build || xcodebuild -sdk iphonesimulator -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

        # تجهيز مجلد الـ IPA الناتج
        mkdir -p Payload/AthkarApp.app
        
        # نسخ ملفات التطبيق والـ Info.plist
        if [ -f "Info.plist" ]; then
          cp Info.plist Payload/AthkarApp.app/
        fi

        # ضغط المجلد لإنشاء ملف الـ .ipa
        zip -r AthkarApp.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AthkarApp-IPA
        path: AthkarApp.ipa
